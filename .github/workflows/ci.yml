name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  # Optional nightly real-model run — uncomment and add repository secrets to enable.
  # schedule:
  #   - cron: "0 3 * * *"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Lint
        run: |
          ruff check .
          ruff format --check .
      - name: Unit tests (mocked clients, no network)
        run: pytest
      - name: Validate corpus
        run: aisec validate
      - name: Offline smoke run (suite=ci, mock)
        run: aisec run --models claude,hermes --suite ci --mock --report
      - uses: actions/upload-artifact@v4
        if: matrix.python-version == '3.12'
        with:
          name: mock-ci-results
          path: results/

